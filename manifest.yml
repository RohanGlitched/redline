modules:
  jira:issuePanel:
    - key: redline-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: large
      title: Redline
      icon: resource:main;redline-icon.svg
  # A dashboard gadget for quality and engineering managers: every change order Redline is holding, and why.
  jira:dashboardGadget:
    - key: redline-gadget
      title: Change orders held by Redline
      description: Lists change orders whose drawing release is blocked, with the reason, and how many are ready to release.
      thumbnail: resource:main;redline-icon.svg
      resource: main
      resolver:
        function: resolver
  # Index the review so JQL (and Rovo) can find change orders whose release is blocked.
  jira:entityProperty:
    - key: redline-index
      entityType: issue
      propertyKey: redline-review
      values:
        - path: gate.status
          type: string
          searchAlias: redlineGate
        - path: gate.open
          type: number
          searchAlias: redlineUndeclared
  # Add this validator to the transition that releases a drawing. It runs Redline's own check: the review
  # is read from app storage (no user can edit it), the verdict is recomputed, and the review must cover
  # the newest PDF revision on the work item.
  jira:workflowValidator:
    - key: redline-release-gate
      name: Redline drawing release gate
      description: Blocks the transition until every change between the last two PDF drawing revisions is declared in the change notes and signed off in Redline, and every pen markup on a photographed print is answered.
      projectTypes: ['company-managed', 'team-managed']
      function: releaseGateFn
  rovo:agent:
    - key: redline-checker
      name: Drawing change checker
      description: Answers questions about engineering change orders reviewed in Redline, such as which drawing changes are undeclared and who signed them off.
      icon: resource:main;redline-icon.svg
      prompt: resource:main;prompts/checker.txt
      conversationStarters:
        - Which change orders are blocked by undeclared drawing changes?
        - Which held change orders have a drawing value that does not match its note?
        - Which change orders are waiting on an answer to a pen markup?
      actions:
        - get-drawing-review
        - find-blocked-change-orders
  action:
    - key: get-drawing-review
      name: Get drawing review
      function: getDrawingReview
      actionVerb: GET
      description: Returns the Redline review of one change order. Each drawing change with its zone, whether a change note declares it, who signed it off, and whether release is blocked.
      inputs:
        issueKey:
          title: Work item key
          type: string
          required: true
          description: The key of the change-order work item, for example ENG-5.
    - key: find-blocked-change-orders
      name: Find blocked change orders
      function: findBlockedChangeOrders
      actionVerb: GET
      description: Lists change-order work items whose Redline release gate is blocked, optionally within one project.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: false
          description: Limit the search to this project key, for example ENG.
  # Keep the JQL copy of the verdict current when drawings, photos or change notes change.
  trigger:
    - key: redline-refresh-index
      function: onIssueUpdated
      events:
        - avi:jira:updated:issue
      # only updates that touch attachments or the description wake the function (no cost otherwise)
      filter:
        ignoreSelf: true
        expression: "event.changelog != null && event.changelog.items.some(i => i.field == 'Attachment' || i.field == 'description')"
        onError: RECEIVE_AND_LOG
    # a deleted work item takes Redline's records about it with it
    - key: redline-forget-deleted
      function: onIssueDeleted
      events:
        - avi:jira:deleted:issue
  function:
    - key: onIssueUpdated
      handler: index.onIssueUpdated
    - key: onIssueDeleted
      handler: index.onIssueDeleted
    - key: resolver
      handler: index.handler
    - key: getDrawingReview
      handler: index.getDrawingReview
    - key: findBlockedChangeOrders
      handler: index.findBlockedChangeOrders
    - key: releaseGateFn
      handler: index.releaseGate
resources:
  - key: main
    path: static/lighttable/dist
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  id: ari:cloud:ecosystem::app/1f09faad-22a5-466a-ae4c-50d4a617e754
